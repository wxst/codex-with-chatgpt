name: Patch final CLI typecheck

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Fix locked token call and callback result narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/cli/index.ts")
          text = file.read_text(encoding="utf-8")

          old_setup = '''      if (info.transportMode === "openai") {
                ensureOpenAITunnelToken(info.workspaceId);'''
          new_setup = '''      if (info.transportMode === "openai") {
                await ensureWorkspaceOpenAITunnelToken(root);'''
          if text.count(old_setup) != 1:
              raise SystemExit(f"expected one unlocked setup token call, found {text.count(old_setup)}")
          text = text.replace(old_setup, new_setup)

          old_quick = '''      if (mode === "quick") {
                let state: ReturnType<typeof chooseQuickTunnel> | null = null;
                await switchWorkspaceTransport(root, "cloudflare", {
                  forceFence: true,
                  afterFence: () => {
                    state = chooseQuickTunnel(workspace.id);
                  },
                });
                if (!state) throw new Error("Cloudflare quick-tunnel preference was not committed");
                const payload = { ...tunnelChoicePayload(workspace), state };'''
          new_quick = '''      if (mode === "quick") {
                const stateBox: { value?: ReturnType<typeof chooseQuickTunnel> } = {};
                await switchWorkspaceTransport(root, "cloudflare", {
                  forceFence: true,
                  afterFence: () => {
                    stateBox.value = chooseQuickTunnel(workspace.id);
                  },
                });
                const state = stateBox.value;
                if (!state) throw new Error("Cloudflare quick-tunnel preference was not committed");
                const payload = { ...tunnelChoicePayload(workspace), state };'''
          if text.count(old_quick) != 1:
              raise SystemExit(f"expected one quick callback result block, found {text.count(old_quick)}")
          text = text.replace(old_quick, new_quick)

          old_named = '''      if (!opts.json) say(NAMED_LOGIN_PROMPT);
              let result: Awaited<ReturnType<typeof provisionNamedTunnel>> | null = null;
              await switchWorkspaceTransport(root, "cloudflare", {
                forceFence: true,
                afterFence: async () => {
                  result = await provisionNamedTunnel({
                    workspaceId: workspace.id,
                    workspaceName: workspace.name,
                    zone,
                    hostname: opts.hostname,
                  });
                },
              });
              if (!result) throw new Error("Cloudflare named-tunnel preference was not committed");

              const payload = {'''
          new_named = '''      if (!opts.json) say(NAMED_LOGIN_PROMPT);
              const resultBox: { value?: Awaited<ReturnType<typeof provisionNamedTunnel>> } = {};
              await switchWorkspaceTransport(root, "cloudflare", {
                forceFence: true,
                afterFence: async () => {
                  resultBox.value = await provisionNamedTunnel({
                    workspaceId: workspace.id,
                    workspaceName: workspace.name,
                    zone,
                    hostname: opts.hostname,
                  });
                },
              });
              const result = resultBox.value;
              if (!result) throw new Error("Cloudflare named-tunnel preference was not committed");

              const payload = {'''
          if text.count(old_named) != 1:
              raise SystemExit(f"expected one named callback result block, found {text.count(old_named)}")
          text = text.replace(old_named, new_named)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-cli-typecheck.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts .github/workflows/patch-cli-typecheck.yml
          git commit -m "fix: complete locked CLI transport wiring"
          git push origin HEAD:fix/review-findings
