name: Patch final CLI typecheck

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Fix locked token call and callback result narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/cli/index.ts")
          text = file.read_text(encoding="utf-8")

          replacements = [
              (
                  "ensureOpenAITunnelToken(info.workspaceId);",
                  "await ensureWorkspaceOpenAITunnelToken(root);",
                  "unlocked setup token call",
              ),
              (
                  "let state: ReturnType<typeof chooseQuickTunnel> | null = null;",
                  "const stateBox: { value?: ReturnType<typeof chooseQuickTunnel> } = {};",
                  "quick callback declaration",
              ),
              (
                  "state = chooseQuickTunnel(workspace.id);",
                  "stateBox.value = chooseQuickTunnel(workspace.id);",
                  "quick callback assignment",
              ),
              (
                  'if (!state) throw new Error("Cloudflare quick-tunnel preference was not committed");',
                  'const state = stateBox.value;\n        if (!state) throw new Error("Cloudflare quick-tunnel preference was not committed");',
                  "quick callback result read",
              ),
              (
                  "let result: Awaited<ReturnType<typeof provisionNamedTunnel>> | null = null;",
                  "const resultBox: { value?: Awaited<ReturnType<typeof provisionNamedTunnel>> } = {};",
                  "named callback declaration",
              ),
              (
                  "result = await provisionNamedTunnel({",
                  "resultBox.value = await provisionNamedTunnel({",
                  "named callback assignment",
              ),
              (
                  'if (!result) throw new Error("Cloudflare named-tunnel preference was not committed");',
                  'const result = resultBox.value;\n      if (!result) throw new Error("Cloudflare named-tunnel preference was not committed");',
                  "named callback result read",
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              text = text.replace(old, new)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-cli-typecheck.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts .github/workflows/patch-cli-typecheck.yml
          git commit -m "fix: complete locked CLI transport wiring"
          git push origin HEAD:fix/review-findings
