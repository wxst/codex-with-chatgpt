name: Patch runtime mirror refresh

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Refresh only positively dead hardened mirrors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/bridge/runtime.ts")
          text = file.read_text(encoding="utf-8")
          old_import = 'import { getProcessGeneration } from "../process/process-identity.js";'
          new_import = 'import { getProcessGeneration, processGenerationStatus } from "../process/process-identity.js";'
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one process identity import, found {text.count(old_import)}")
          text = text.replace(old_import, new_import)

          insertion_marker = '''function isRuntimeState(value: unknown, workspaceId: string): value is RuntimeState {'''
          if text.count(insertion_marker) != 1:
              raise SystemExit("runtime validation marker missing")
          helper = r'''
          /**
           * Refresh a compatibility mirror only after proving that the exact
           * generation currently occupying the pathname is dead. The existing
           * file is first moved aside atomically, then revalidated. If another
           * writer wins the pathname or the moved state changed, that writer is
           * preserved. A generationless legacy mirror is never replaced.
           */
          function publishCanonicalMirror(file: string, payload: string, workspaceId: string): void {
            if (!fs.existsSync(file)) {
              createCanonicalMirrorIfAbsent(file, payload);
              return;
            }

            const observed = readRuntimeStrict(file, workspaceId);
            if (!observed.processGeneration) return;
            if (processGenerationStatus(observed.pid, observed.processGeneration) !== "mismatch") return;

            const displaced = `${file}.${process.pid}.${randomUUID()}.displaced`;
            try {
              try {
                fs.renameSync(file, displaced);
              } catch (error) {
                if ((error as NodeJS.ErrnoException).code === "ENOENT") {
                  createCanonicalMirrorIfAbsent(file, payload);
                  return;
                }
                throw error;
              }

              const moved = readRuntimeStrict(displaced, workspaceId);
              const sameGeneration = runtimeIdentity(moved) === runtimeIdentity(observed);
              const movedStillDead =
                Boolean(moved.processGeneration) &&
                processGenerationStatus(moved.pid, moved.processGeneration as string) === "mismatch";

              if (sameGeneration && movedStillDead) {
                createCanonicalMirrorIfAbsent(file, payload);
              }

              // If the moved file was not the exact dead generation observed,
              // restore it only when no concurrent writer already owns the path.
              if (!sameGeneration || !movedStillDead) {
                try {
                  fs.linkSync(displaced, file);
                } catch (error) {
                  if ((error as NodeJS.ErrnoException).code !== "EEXIST") throw error;
                }
              }
            } finally {
              // Never leave the compatibility pathname absent because a
              // filesystem rejected the no-overwrite publication primitive.
              if (fs.existsSync(displaced) && !fs.existsSync(file)) {
                try {
                  fs.linkSync(displaced, file);
                } catch (error) {
                  if ((error as NodeJS.ErrnoException).code !== "EEXIST") throw error;
                }
              }
              try {
                fs.rmSync(displaced, { force: true });
              } catch {
                // best effort after the pathname has a complete owner
              }
            }
          }

          '''
          text = text.replace(insertion_marker, helper + insertion_marker)

          old_call = '  createCanonicalMirrorIfAbsent(runtimeFile(normalized.workspaceId), payload);'
          new_call = '  publishCanonicalMirror(runtimeFile(normalized.workspaceId), payload, normalized.workspaceId);'
          if text.count(old_call) != 1:
              raise SystemExit(f"expected one canonical publication call, found {text.count(old_call)}")
          text = text.replace(old_call, new_call)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-runtime-mirror-refresh.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+wxst@users.noreply.github.com"
          git add src/bridge/runtime.ts .github/workflows/patch-runtime-mirror-refresh.yml
          git commit -m "fix: refresh positively dead runtime mirrors"
          git push origin HEAD:fix/review-findings
