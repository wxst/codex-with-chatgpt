name: Patch Windows process generation

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Harden Windows generation observation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/process/process-identity.ts")
          text = file.read_text(encoding="utf-8")

          imports = '''import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";
          '''
          constants = '''import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";

          const WINDOWS_GENERATION_TIMEOUT_MS = 15_000;
          const WINDOWS_NATIVE_CAPABILITY_TIMEOUT_MS = 20_000;
          const WINDOWS_NATIVE_SIGNAL_TIMEOUT_MS = 15_000;
          let cachedCurrentProcessGeneration: string | undefined;
          '''

          old_generation = '''export function getProcessGeneration(pid: number): string | null {
            if (!validPid(pid)) return null;
            if (process.platform === "linux") return linuxGeneration(pid);
            if (process.platform === "win32") return windowsGeneration(pid);
            if (process.platform === "darwin" || process.platform === "freebsd" || process.platform === "openbsd") {
              return unixPsGeneration(pid);
            }
            return null;
          }'''
          new_generation = '''export function getProcessGeneration(pid: number): string | null {
            if (!validPid(pid)) return null;
            if (pid === process.pid && cachedCurrentProcessGeneration) return cachedCurrentProcessGeneration;

            let generation: string | null;
            if (process.platform === "linux") generation = linuxGeneration(pid);
            else if (process.platform === "win32") generation = windowsGeneration(pid);
            else if (process.platform === "darwin" || process.platform === "freebsd" || process.platform === "openbsd") {
              generation = unixPsGeneration(pid);
            } else {
              generation = null;
            }

            // A process cannot change its own creation identity while it remains
            // alive. Cache only a successful observation; transient lookup
            // failures remain retryable and never weaken fail-closed behavior.
            if (pid === process.pid && generation) cachedCurrentProcessGeneration = generation;
            return generation;
          }'''

          replacements = [
              (imports, constants, "imports/constants"),
              (old_generation, new_generation, "getProcessGeneration"),
              ('timeout: 2500,\n      windowsHide: true,\n    });\n    if (result.status !== 0) return null;',
               'timeout: WINDOWS_GENERATION_TIMEOUT_MS,\n      windowsHide: true,\n    });\n    if (result.status !== 0) return null;',
               "Windows generation timeout"),
              ('{ encoding: "utf8", timeout: 8000, windowsHide: true }',
               '{ encoding: "utf8", timeout: WINDOWS_NATIVE_CAPABILITY_TIMEOUT_MS, windowsHide: true }',
               "Windows capability timeout"),
              ('{ encoding: "utf8", timeout: 5000, windowsHide: true }',
               '{ encoding: "utf8", timeout: WINDOWS_NATIVE_SIGNAL_TIMEOUT_MS, windowsHide: true }',
               "Windows signal timeout"),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label} target, found {count}")
              text = text.replace(old, new)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-windows-generation.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/process/process-identity.ts .github/workflows/patch-windows-generation.yml
          git commit -m "fix: stabilize Windows process-generation checks"
          git push origin HEAD:fix/review-findings
