name: Patch Windows helper inputs

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Pass native helper inputs through the environment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/process/process-identity.ts")
          text = file.read_text(encoding="utf-8")

          pid_arg = '$pidValue=[uint32]$args[0]'
          if text.count(pid_arg) != 2:
              raise SystemExit(f"expected two positional PID reads, found {text.count(pid_arg)}")
          text = text.replace(pid_arg, '$pidValue=[uint32]$env:C2C_PROCESS_PID')

          expected_arg = '$expected=$args[1]'
          if text.count(expected_arg) != 1:
              raise SystemExit(f"expected one positional generation read, found {text.count(expected_arg)}")
          text = text.replace(expected_arg, '$expected=$env:C2C_EXPECTED_GENERATION')

          old_generation_spawn = '''      ["-NoProfile", "-NonInteractive", "-Command", script, String(pid)],
                {
                  encoding: "utf8",
                  timeout: WINDOWS_GENERATION_TIMEOUT_MS,
                  windowsHide: true,
                }'''
          new_generation_spawn = '''      ["-NoProfile", "-NonInteractive", "-Command", script],
                {
                  encoding: "utf8",
                  timeout: WINDOWS_GENERATION_TIMEOUT_MS,
                  windowsHide: true,
                  env: {
                    ...process.env,
                    C2C_PROCESS_PID: String(pid),
                  },
                }'''
          if text.count(old_generation_spawn) != 1:
              raise SystemExit(f"expected one Windows generation spawn block, found {text.count(old_generation_spawn)}")
          text = text.replace(old_generation_spawn, new_generation_spawn)

          old_signal_spawn = '''      ["-NoProfile", "-NonInteractive", "-Command", WINDOWS_HANDLE_SIGNAL_SCRIPT, String(pid), expectedGeneration],
                { encoding: "utf8", timeout: WINDOWS_NATIVE_SIGNAL_TIMEOUT_MS, windowsHide: true }'''
          new_signal_spawn = '''      ["-NoProfile", "-NonInteractive", "-Command", WINDOWS_HANDLE_SIGNAL_SCRIPT],
                {
                  encoding: "utf8",
                  timeout: WINDOWS_NATIVE_SIGNAL_TIMEOUT_MS,
                  windowsHide: true,
                  env: {
                    ...process.env,
                    C2C_PROCESS_PID: String(pid),
                    C2C_EXPECTED_GENERATION: expectedGeneration,
                  },
                }'''
          if text.count(old_signal_spawn) != 1:
              raise SystemExit(f"expected one Windows signal spawn block, found {text.count(old_signal_spawn)}")
          text = text.replace(old_signal_spawn, new_signal_spawn)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-windows-helper-env.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/process/process-identity.ts .github/workflows/patch-windows-helper-env.yml
          git commit -m "fix: pass Windows helper inputs reliably"
          git push origin HEAD:fix/review-findings
