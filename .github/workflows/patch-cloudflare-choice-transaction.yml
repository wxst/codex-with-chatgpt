name: Patch atomic Cloudflare choice mutation

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Keep quick/named mutation inside the lifecycle transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/cli/index.ts")
          text = file.read_text(encoding="utf-8")
          start_marker = '''tunnelCmd
            .command("choose")'''
          end_marker = '''
          tunnelCmd
            .command("login")'''
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = '''tunnelCmd
            .command("choose")
            .description("Remember quick vs named, and provision a named hostname when asked")
            .requiredOption("--mode <mode>", "quick or named")
            .option("-w, --workspace <path>")
            .option("--zone <domain>", "Cloudflare domain for a named hostname")
            .option("--hostname <hostname>", "override the default c2c-<project>.<zone>")
            .option("--json", "machine-readable output", false)
            .action(async (opts: { mode: string; workspace?: string; zone?: string; hostname?: string; json: boolean }) => {
              const root = resolveWorkspace(opts.workspace);
              try {
                const workspace = new Workspace(root);
                const mode = opts.mode.trim().toLowerCase();
                if (mode !== "quick" && mode !== "named") {
                  throw new Error("mode must be quick or named");
                }

                if (mode === "quick") {
                  let state: ReturnType<typeof chooseQuickTunnel> | null = null;
                  await switchWorkspaceTransport(root, "cloudflare", {
                    forceFence: true,
                    afterFence: () => {
                      state = chooseQuickTunnel(workspace.id);
                    },
                  });
                  if (!state) throw new Error("Cloudflare quick-tunnel preference was not committed");
                  const payload = { ...tunnelChoicePayload(workspace), state };
                  if (opts.json) say(JSON.stringify(payload));
                  else check("已选用临时地址");
                  return;
                }

                const zone = parseZoneInput(opts.zone ?? "");
                if (!zone) {
                  const payload = {
                    ok: false,
                    need: "zone",
                    userMessage: "请告诉我已经加在 Cloudflare 上的域名，例如 example.com",
                    loginPrompt: NAMED_LOGIN_PROMPT,
                  };
                  if (opts.json) {
                    say(JSON.stringify(payload));
                    return;
                  }
                  say(payload.userMessage);
                  return;
                }

                if (!opts.json) say(NAMED_LOGIN_PROMPT);
                let result: Awaited<ReturnType<typeof provisionNamedTunnel>> | null = null;
                await switchWorkspaceTransport(root, "cloudflare", {
                  forceFence: true,
                  afterFence: async () => {
                    result = await provisionNamedTunnel({
                      workspaceId: workspace.id,
                      workspaceName: workspace.name,
                      zone,
                      hostname: opts.hostname,
                    });
                  },
                });
                if (!result) throw new Error("Cloudflare named-tunnel preference was not committed");

                const payload = {
                  ...tunnelChoicePayload(workspace),
                  ok: true,
                  fallback: result.fallback,
                  userMessage: result.userMessage,
                  error: result.error,
                  state: result.state,
                };
                if (opts.json) {
                  say(JSON.stringify(payload));
                  return;
                }
                if (result.fallback) say(result.userMessage ?? "");
                else check(`固定域名已就绪：${result.state.hostname}`);
              } catch (error) {
                handleCliError(error, opts.json);
              }
            });
          '''

          file.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          Path(".github/workflows/patch-cloudflare-choice-transaction.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts .github/workflows/patch-cloudflare-choice-transaction.yml
          git commit -m "fix: transact Cloudflare choice mutation"
          git push origin HEAD:fix/review-findings
