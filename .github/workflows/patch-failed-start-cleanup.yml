name: Patch failed-start cleanup confirmation

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Require an affirmative cleanup fence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/process/daemon.ts")
          text = file.read_text(encoding="utf-8")

          old_interface = '''export interface BridgeStartupWaitOptions {
            timeoutMs?: number;
            pollMs?: number;
            findLive?: (workspaceId: string) => Promise<RuntimeState | null>;
            sleep?: (ms: number) => Promise<void>;
          }'''
          new_interface = '''export interface BridgeStartupWaitOptions {
            timeoutMs?: number;
            pollMs?: number;
            findLive?: (workspaceId: string) => Promise<RuntimeState | null>;
            sleep?: (ms: number) => Promise<void>;
            stopBridge?: (workspaceRoot: string) => Promise<boolean>;
          }'''

          old_setup = '''  const findLive = options.findLive ?? findLiveBridge;
            const sleep = options.sleep ?? ((ms: number) => new Promise<void>((resolve) => setTimeout(resolve, ms)));'''
          new_setup = '''  const findLive = options.findLive ?? findLiveBridge;
            const sleep = options.sleep ?? ((ms: number) => new Promise<void>((resolve) => setTimeout(resolve, ms)));
            const stopWorkspace = options.stopBridge ?? stopBridge;'''

          old_cleanup = '''  } catch (startupError) {
              try {
                await stopBridge(workspace.root);
              } catch (cleanupError) {
                throw new AggregateError(
                  [startupError, cleanupError],
                  "Bridge startup failed and the workspace could not be fully fenced during cleanup"
                );
              }
              throw startupError;
            }'''
          new_cleanup = '''  } catch (startupError) {
              try {
                const cleanupConfirmed = await stopWorkspace(workspace.root);
                if (!cleanupConfirmed) {
                  throw new Error("Failed-start cleanup was not confirmed by the workspace lifecycle fence");
                }
              } catch (cleanupError) {
                throw new AggregateError(
                  [startupError, cleanupError],
                  "Bridge startup failed and the workspace could not be fully fenced during cleanup"
                );
              }
              throw startupError;
            }'''

          for old, new, label in (
              (old_interface, new_interface, "BridgeStartupWaitOptions"),
              (old_setup, new_setup, "wait setup"),
              (old_cleanup, new_cleanup, "cleanup block"),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label} target, found {count}")
              text = text.replace(old, new)

          file.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-failed-start-cleanup.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/process/daemon.ts .github/workflows/patch-failed-start-cleanup.yml
          git commit -m "fix: require confirmed failed-start cleanup"
          git push origin HEAD:fix/review-findings
