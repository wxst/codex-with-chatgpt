name: Apply transport fence fix

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Apply reviewed one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli = Path("src/cli/index.ts")
          text = cli.read_text(encoding="utf-8")
          old = '''        writeTransportMode(workspace.id, next);
                  if (previous !== next && (await findLiveBridge(workspace.id))) {
                    await stopBridge(root);
                  }'''
          new = '''        writeTransportMode(workspace.id, next);
                  if (previous !== next) {
                    await stopBridge(root);
                  }'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one transport guard, found {text.count(old)}")
          cli.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/latest-review-findings.test.ts")
          test_text = test.read_text(encoding="utf-8")
          marker = '''  it("cancels a pending start when the daemon health wait times out", async () => {'''
          regression = '''  it("always lifecycle-fences a transport mode change, even with only a pending child", () => {
              const cliSource = fs.readFileSync(path.join(process.cwd(), "src", "cli", "index.ts"), "utf8");
              expect(cliSource).toContain("if (previous !== next) {\\n          await stopBridge(root);");
              expect(cliSource).not.toContain("previous !== next && (await findLiveBridge");
            });
          
          '''
          if regression not in test_text:
              if marker not in test_text:
                  raise SystemExit("test insertion marker not found")
              test.write_text(test_text.replace(marker, regression + marker, 1), encoding="utf-8")

          Path(".github/workflows/apply-transport-fence.yml").unlink()
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts tests/latest-review-findings.test.ts .github/workflows/apply-transport-fence.yml
          git commit -m "fix: fence transport changes against pending starts"
          git push origin HEAD:fix/review-findings
