name: Patch Windows generation format

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Correct native generation format validation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("src/process/process-identity.ts")
          text = file.read_text(encoding="utf-8")
          old = r'if (!/^win32:\\d{4}-\\d{2}-\\d{2}T/.test(generation)) return null;'
          new = r'if (!/^win32:\d{4}-\d{2}-\d{2}T/.test(generation)) return null;'
          if text.count(old) != 1:
              raise SystemExit(f"expected one over-escaped Windows generation regex, found {text.count(old)}")
          file.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/patch-windows-generation-regex.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/process/process-identity.ts .github/workflows/patch-windows-generation-regex.yml
          git commit -m "fix: validate native Windows generation format"
          git push origin HEAD:fix/review-findings
