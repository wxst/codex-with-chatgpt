name: Apply hardening patchset

on:
  push:
    branches:
      - hardening/v1
    paths:
      - scripts/apply-hardening-v3.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Apply deterministic patches
        run: python3 scripts/apply-hardening-v3.py

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Verify patchset
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          git diff --check

      - name: Commit generated patchset
        run: |
          git config user.name "wxst-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src/cli/index.ts skill/SKILL.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: integrate hardened transport workflow"
          git push origin HEAD:hardening/v1
