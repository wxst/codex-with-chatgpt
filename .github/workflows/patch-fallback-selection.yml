name: Patch fallback transport selection

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Route fallback selection through transaction helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cli = Path("src/cli/index.ts")
          text = cli.read_text(encoding="utf-8")
          old = '''      const workspace = new Workspace(root);
                writeTransportMode(workspace.id, "cloudflare");
                const mode = opts.mode.trim().toLowerCase();
                const previous = readTunnelState(workspace.id);
                if (mode === "quick") {'''
          new = '''      const workspace = new Workspace(root);
                const mode = opts.mode.trim().toLowerCase();
                if (mode !== "quick" && mode !== "named") {
                  throw new Error("mode must be quick or named");
                }
                await switchWorkspaceTransport(root, "cloudflare");
                const previous = readTunnelState(workspace.id);
                if (mode === "quick") {'''
          redundant = '''      if (mode !== "named") {
                throw new Error("mode must be quick or named");
              }
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected one fallback selection block, found {text.count(old)}")
          if text.count(redundant) != 1:
              raise SystemExit(f"expected one redundant validation block, found {text.count(redundant)}")

          text = text.replace(old, new).replace(redundant, "")
          cli.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-fallback-selection.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cli/index.ts .github/workflows/patch-fallback-selection.yml
          git commit -m "fix: transact fallback transport selection"
          git push origin HEAD:fix/review-findings
