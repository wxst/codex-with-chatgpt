name: Patch lifecycle-aware stop

on:
  push:
    branches:
      - fix/review-findings

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/review-findings
          fetch-depth: 0

      - name: Refactor stop under an owned lifecycle lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          identity = Path("src/process/process-identity.ts")
          identity_text = identity.read_text(encoding="utf-8")
          old_exists = "function numericPidExists(pid: number): boolean {"
          new_exists = "export function processExists(pid: number): boolean {"
          if identity_text.count(old_exists) != 1:
              raise SystemExit(f"expected one numeric PID helper, found {identity_text.count(old_exists)}")
          identity_text = identity_text.replace(old_exists, new_exists)
          if identity_text.count("numericPidExists(pid)") != 1:
              raise SystemExit("expected one internal numericPidExists call")
          identity_text = identity_text.replace("numericPidExists(pid)", "processExists(pid)")
          identity.write_text(identity_text, encoding="utf-8")

          daemon = Path("src/process/daemon.ts")
          text = daemon.read_text(encoding="utf-8")
          old_import = '''import {
            processGenerationStatus,
            signalExactProcessGeneration,
          } from "./process-identity.js";'''
          new_import = '''import {
            processExists,
            processGenerationStatus,
            signalExactProcessGeneration,
          } from "./process-identity.js";'''
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one process identity import block, found {text.count(old_import)}")
          text = text.replace(old_import, new_import)

          marker = "export async function stopBridge(workspaceRoot: string): Promise<boolean> {"
          start = text.index(marker)
          replacement = r'''export async function stopBridgeWithinLifecycleLock(workspaceRoot: string): Promise<boolean> {
            const workspace = new Workspace(workspaceRoot);
            const cancelledPending = cancelPendingStarts(workspace.id);
            if (listPendingStarts(workspace.id).length !== 0) {
              throw new Error(`Pending bridge starts remain after cancellation for workspace ${workspace.id}`);
            }

            const runtimes = listRuntimeStates(workspace.id);
            if (runtimes.length === 0) return cancelledPending > 0;

            let allStopped = true;
            const observedPorts = new Set<number>();
            const stoppedLegacy = new Set<string>();

            for (const runtime of runtimes) {
              observedPorts.add(runtime.port);
              let stopped = false;

              if (runtime.processGeneration) {
                const status = processGenerationStatus(runtime.pid, runtime.processGeneration);
                if (status === "mismatch") {
                  // The exact recorded generation is positively gone. Do not signal a
                  // recycled PID; endpoint verification still catches a replacement.
                  stopped = true;
                } else {
                  stopped = await stopBridgeRuntime(workspace.root, runtime);
                }
              } else {
                // A generationless runtime can be considered dead only when the
                // numeric PID is positively absent. A reused/live PID remains
                // conservative and is never signalled without authenticated identity.
                stopped = await stopBridgeRuntime(workspace.root, runtime);
                if (!stopped && !processExists(runtime.pid)) stopped = true;
              }

              if (stopped) {
                if (!runtime.processGeneration) stoppedLegacy.add(runtimeIdentity(runtime));
                removeRuntimeStateGeneration(runtime);
              } else {
                allStopped = false;
              }
            }

            for (const port of observedPorts) {
              const health = await probeBridge(port, 1000);
              if (health?.service === SERVICE_NAME && health.workspaceId === workspace.id && health.status === "ok") {
                allStopped = false;
              }
            }

            for (const runtime of listRuntimeStates(workspace.id)) {
              observedPorts.add(runtime.port);
              if (runtime.processGeneration) {
                if (processGenerationStatus(runtime.pid, runtime.processGeneration) !== "mismatch") {
                  allStopped = false;
                }
              } else if (!stoppedLegacy.has(runtimeIdentity(runtime)) && processExists(runtime.pid)) {
                allStopped = false;
              }
            }

            if (listPendingStarts(workspace.id).length !== 0) allStopped = false;
            if (!allStopped) {
              throw new Error(`One or more Bridge generations for workspace ${workspace.id} could not be fully stopped`);
            }
            return true;
          }

          export async function stopBridge(workspaceRoot: string): Promise<boolean> {
            const workspace = new Workspace(workspaceRoot);
            const lock = await acquireWorkspaceLifecycleLock(workspace.id);
            try {
              return await stopBridgeWithinLifecycleLock(workspace.root);
            } finally {
              lock.release();
            }
          }
          '''
          text = text[:start] + replacement
          daemon.write_text(text, encoding="utf-8")

          Path(".github/workflows/patch-lifecycle-stop.yml").unlink()
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/process/process-identity.ts src/process/daemon.ts .github/workflows/patch-lifecycle-stop.yml
          git commit -m "fix: share stop logic with transport transactions"
          git push origin HEAD:fix/review-findings
